
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mundo de Criaturas</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Fuente desde Google Fonts para darle un toque épico -->
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="app-container">

        <!-- ========================== -->
        <!-- 1. PERFIL DEL JUGADOR       -->
        <!-- ========================== -->
        <header class="profile">
            <div class="profile-avatar">
                <!-- Placeholder para la imagen de perfil -->
                <span>🐉</span>
            </div>
            <div class="profile-info">
                <h2 id="playerName">ShadowRider</h2>
                <span class="player-level">Nivel <span id="playerLevel">37</span></span>
            </div>
            <div class="profile-coins">
                <span>🪙</span>
                <span id="playerCoins">12,450</span>
            </div>
        </header>

        <!-- ========================== -->
        <!-- 2. MENÚ PRINCIPAL            -->
        <!-- ========================== -->
        <nav class="main-menu">

            <div class="menu-item" data-section="mazmorras">
                <div class="menu-icon">⚔️</div>
                <div class="menu-label">MÁZMORRAS</div>
            </div>

            <div class="menu-item" data-section="granja">
                <div class="menu-icon">🌱</div>
                <div class="menu-label">GRANJA DE CRÍA</div>
            </div>

            <div class="menu-item" data-section="coliseo">
                <div class="menu-icon">🏟️</div>
                <div class="menu-label">COLISEO</div>
            </div>

            <div class="menu-item" data-section="mercado">
                <div class="menu-icon">🏪</div>
                <div class="menu-label">MERCADO</div>
            </div>

            <div class="menu-item" data-section="gremios">
                <div class="menu-icon">🏰</div>
                <div class="menu-label">GREMIOS</div>
            </div>

            <div class="menu-item" data-section="chat">
                <div class="menu-icon">💬</div>
                <div class="menu-label">CHAT</div>
            </div>

            <div class="menu-item" data-section="salon-fama">
                <div class="menu-icon">🏆</div>
                <div class="menu-label">SALÓN DE LA FAMA</div>
            </div>

            <div class="menu-item" data-section="cartera">
                <div class="menu-icon">💰</div>
                <div class="menu-label">CARTERA</div>
            </div>

            <div class="menu-item" data-section="ajustes">
                <div class="menu-icon">⚙️</div>
                <div class="menu-label">AJUSTES</div>
            </div>

        </nav>

        <!-- ========================== -->
        <!-- 3. PIE DE PÁGINA            -->
        <!-- ========================== -->
        <footer class="app-footer">
            <p>v0.1 — Prototipo</p>
        </footer>

    </div>

    <!-- ========================== -->
    <!-- 4. JAVASCRIPT (próximamente) -->
    <!-- ========================== -->
    <script src="app.js"></script>
</body>
</html>
